<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="One brain. Many uses."><rect width="1200" height="675" rx="28" fill="#090a0d"/><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f5} .title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:16px;fill:#a1a1aa}.blue{fill:#101f36;stroke:#4b9dff;stroke-width:2}.pink{fill:#351722;stroke:#e66b94;stroke-width:2}.neutral{fill:#141519;stroke:#44454d;stroke-width:2}.line{fill:none;stroke:#777b88;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style></defs><text x="64" y="72" class="title">One brain. Many uses.</text><text x="64" y="103" class="small">The shared context stays stable while roles and models change.</text><path d="M64 125H1136" stroke="#303139" stroke-width="2"/><rect x="390" y="250" width="420" height="160" rx="20" class="blue"/><text x="600.0" y="321.0" text-anchor="middle" class="label">Company brain</text><text x="600.0" y="352.0" text-anchor="middle" class="small">Knowledge · context · permissions</text><rect x="65" y="170" width="240" height="92" rx="20" class="pink"/><text x="185.0" y="222.0" text-anchor="middle" class="label">Question answering</text><rect x="895" y="170" width="240" height="92" rx="20" class="pink"/><text x="1015.0" y="222.0" text-anchor="middle" class="label">Sales agent</text><rect x="65" y="475" width="240" height="92" rx="20" class="pink"/><text x="185.0" y="527.0" text-anchor="middle" class="label">Automation</text><rect x="895" y="475" width="240" height="92" rx="20" class="pink"/><text x="1015.0" y="527.0" text-anchor="middle" class="label">Engineering agent</text><path d="M305 216H390" class="line"/><path d="M810 216H895" class="line"/><path d="M305 521H390" class="line"/><path d="M810 521H895" class="line"/><text x="600" y="618" text-anchor="middle" class="small">Build understanding once. Reuse it everywhere.</text></svg>