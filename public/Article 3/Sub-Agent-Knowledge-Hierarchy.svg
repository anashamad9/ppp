<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">How a Sub-Agent Inherits Knowledge</title>
  <desc id="desc">A bilingual English and Arabic diagram showing knowledge inheritance from a main agent through currency, mapping, and source-specific layers to a source agent.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.52" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102B45"/>
      <stop offset="1" stop-color="#0C1C30"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173C31"/>
      <stop offset="1" stop-color="#10271F"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#47252F"/>
      <stop offset="1" stop-color="#291923"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#49351D"/>
      <stop offset="1" stop-color="#2A2118"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <marker id="arrowWhite" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L10 6L1 11Z" fill="#DDE8F4"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L10 6L1 11Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L10 6L1 11Z" fill="#FB7185"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Noto Sans Arabic", "Segoe UI", Arial, sans-serif; }
      .ar { font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 760; letter-spacing: -1px; fill: #F7FAFC; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #38BDF8; }
      .card-title { font-size: 27px; font-weight: 720; fill: #F8FAFC; }
      .card-sub { font-size: 18px; font-weight: 430; fill: #C9D5E3; }
      .side-title { font-size: 23px; font-weight: 700; fill: #F8FAFC; }
      .side-item { font-size: 19px; font-weight: 600; fill: #D7E1EC; }
      .note-title { font-size: 21px; font-weight: 720; fill: #F8FAFC; }
      .note-body { font-size: 17px; font-weight: 430; fill: #D4DFEA; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Header -->
  <g class="ui">
    <text x="96" y="72" class="eyebrow">KNOWLEDGE ARCHITECTURE</text>
    <text x="96" y="130" class="title">How a Sub-Agent Inherits Knowledge</text>
    <text x="1824" y="130" text-anchor="end" class="title ar" font-size="43">كيف يرث الوكيل الفرعي المعرفة</text>
    <path d="M96 160H1824" stroke="#90A4BC" stroke-opacity=".18"/>
  </g>

  <!-- Left hierarchy panel -->
  <g class="ui">
    <rect x="96" y="214" width="352" height="744" rx="28" fill="#0A1524" fill-opacity=".78" stroke="#8194AA" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="132" cy="257" r="8" fill="#38BDF8"/>
    <text x="157" y="264" class="side-title">Knowledge Hierarchy</text>
    <text x="272" y="304" text-anchor="middle" class="side-title ar" font-size="21">التسلسل الهرمي للمعرفة</text>

    <g>
      <rect x="128" y="350" width="288" height="92" rx="18" fill="#10243A" stroke="#38BDF8" stroke-opacity=".35"/>
      <text x="272" y="386" text-anchor="middle" class="side-item">General</text>
      <text x="272" y="416" text-anchor="middle" class="side-item ar" font-size="18">عام</text>
      <path d="M272 442V474" stroke="#7590A9" stroke-width="3" marker-end="url(#arrowWhite)"/>

      <rect x="128" y="488" width="288" height="92" rx="18" fill="#10243A" stroke="#38BDF8" stroke-opacity=".25"/>
      <text x="272" y="524" text-anchor="middle" class="side-item">Group</text>
      <text x="272" y="554" text-anchor="middle" class="side-item ar" font-size="18">مجموعة</text>
      <path d="M272 580V612" stroke="#7590A9" stroke-width="3" marker-end="url(#arrowWhite)"/>

      <rect x="128" y="626" width="288" height="92" rx="18" fill="#10243A" stroke="#38BDF8" stroke-opacity=".2"/>
      <text x="272" y="662" text-anchor="middle" class="side-item">Subgroup</text>
      <text x="272" y="692" text-anchor="middle" class="side-item ar" font-size="18">مجموعة فرعية</text>
      <path d="M272 718V750" stroke="#7590A9" stroke-width="3" marker-end="url(#arrowWhite)"/>

      <rect x="128" y="764" width="288" height="92" rx="18" fill="#122B45" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="272" y="800" text-anchor="middle" class="side-item">Source</text>
      <text x="272" y="830" text-anchor="middle" class="side-item ar" font-size="18">مصدر</text>
    </g>
    <rect x="128" y="890" width="288" height="40" rx="20" fill="#10243A"/>
    <text x="272" y="916" text-anchor="middle" class="label" fill="#8EA7C1">GENERAL → SPECIFIC</text>
  </g>

  <!-- Main vertical inheritance path -->
  <g class="ui">
    <path d="M953 864V296" stroke="#7E94AA" stroke-opacity=".3" stroke-width="8" stroke-linecap="round"/>

    <!-- Main Agent -->
    <g>
      <rect x="604" y="206" width="698" height="134" rx="24" fill="url(#blueCard)" stroke="#38BDF8" stroke-width="2.5"/>
      <rect x="630" y="227" width="112" height="29" rx="14" fill="#38BDF8" fill-opacity=".13"/>
      <text x="686" y="247" text-anchor="middle" class="label" fill="#7DD3FC">GENERAL</text>
      <text x="953" y="282" text-anchor="middle" class="card-title">Main Agent <tspan fill="#7DD3FC">/</tspan> <tspan class="ar">الوكيل الرئيسي</tspan></text>
      <text x="953" y="315" text-anchor="middle" class="card-sub">Template, validation &amp; general rules <tspan fill="#7DD3FC">/</tspan> <tspan class="ar">القالب، التحقق، والقواعد العامة</tspan></text>
    </g>

    <path d="M953 402V350" stroke="#DDE8F4" stroke-width="4" marker-end="url(#arrowWhite)"/>
    <!-- SAR Sources -->
    <g>
      <rect x="604" y="402" width="698" height="118" rx="22" fill="url(#greenCard)" stroke="#4ADE80" stroke-width="2.5"/>
      <rect x="630" y="423" width="89" height="28" rx="14" fill="#4ADE80" fill-opacity=".14"/>
      <text x="675" y="443" text-anchor="middle" class="label" fill="#86EFAC">GROUP</text>
      <text x="953" y="465" text-anchor="middle" class="card-title">SAR Sources <tspan fill="#86EFAC">/</tspan> <tspan class="ar">مصادر الريال</tspan></text>
      <text x="953" y="498" text-anchor="middle" class="card-sub">Shared currency rules <tspan fill="#86EFAC">/</tspan> <tspan class="ar">قواعد العملة المشتركة</tspan></text>
    </g>

    <path d="M953 582V530" stroke="#DDE8F4" stroke-width="4" marker-end="url(#arrowWhite)"/>
    <!-- Mapping Group -->
    <g>
      <rect x="604" y="582" width="698" height="118" rx="22" fill="url(#redCard)" stroke="#FB7185" stroke-width="2.5"/>
      <rect x="630" y="603" width="113" height="28" rx="14" fill="#FB7185" fill-opacity=".14"/>
      <text x="687" y="623" text-anchor="middle" class="label" fill="#FDA4AF">SUBGROUP</text>
      <text x="953" y="645" text-anchor="middle" class="card-title">Mapping Group <tspan fill="#FDA4AF">/</tspan> <tspan class="ar">مجموعة الربط</tspan></text>
      <text x="953" y="678" text-anchor="middle" class="card-sub">Shared mapping rules <tspan fill="#FDA4AF">/</tspan> <tspan class="ar">قواعد الربط المشتركة</tspan></text>
    </g>

    <path d="M953 762V710" stroke="#DDE8F4" stroke-width="4" marker-end="url(#arrowWhite)"/>
    <!-- Source Exceptions -->
    <g>
      <rect x="604" y="762" width="698" height="118" rx="22" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="630" y="783" width="85" height="28" rx="14" fill="#F59E0B" fill-opacity=".14"/>
      <text x="673" y="803" text-anchor="middle" class="label" fill="#FCD34D">SOURCE</text>
      <text x="953" y="825" text-anchor="middle" class="card-title">Source Exceptions <tspan fill="#FCD34D">/</tspan> <tspan class="ar">استثناءات المصدر</tspan></text>
      <text x="953" y="858" text-anchor="middle" class="card-sub">Source-specific details <tspan fill="#FCD34D">/</tspan> <tspan class="ar">تفاصيل خاصة بالمصدر</tspan></text>
    </g>

    <path d="M953 942V890" stroke="#DDE8F4" stroke-width="4" marker-end="url(#arrowWhite)"/>
    <!-- Source Agent -->
    <g>
      <rect x="604" y="942" width="698" height="106" rx="22" fill="url(#blueCard)" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="646" cy="976" r="14" fill="#38BDF8" fill-opacity=".18" stroke="#38BDF8"/>
      <circle cx="646" cy="976" r="5" fill="#7DD3FC"/>
      <text x="953" y="989" text-anchor="middle" class="card-title">Source 32 Agent <tspan fill="#7DD3FC">/</tspan> <tspan class="ar">وكيل المصدر 32</tspan></text>
      <text x="953" y="1023" text-anchor="middle" class="card-sub">Processes one source <tspan fill="#7DD3FC">/</tspan> <tspan class="ar">يعالج مصدراً واحداً</tspan></text>
    </g>
  </g>

  <!-- Right callouts -->
  <g class="ui">
    <g>
      <rect x="1406" y="222" width="418" height="210" rx="24" fill="#0D2238" fill-opacity=".96" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="1450" cy="264" r="16" fill="#38BDF8" fill-opacity=".16"/>
      <path d="M1443 264h14M1450 257v14" stroke="#7DD3FC" stroke-width="2.4" stroke-linecap="round"/>
      <text x="1480" y="272" class="note-title">Shared by every agent</text>
      <text x="1615" y="313" text-anchor="middle" class="note-title ar" font-size="20">المعرفة العامة في الأعلى</text>
      <text x="1615" y="351" text-anchor="middle" class="note-body">General knowledge sits at the top</text>
      <text x="1615" y="380" text-anchor="middle" class="note-body">and flows to all sub-agents.</text>
      <text x="1615" y="412" text-anchor="middle" class="note-body ar">وتنتقل إلى جميع الوكلاء الفرعيين</text>
    </g>
    <path d="M1406 326H1324" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <g>
      <rect x="1406" y="744" width="418" height="256" rx="24" fill="#321D28" fill-opacity=".97" stroke="#FB7185" stroke-width="2"/>
      <circle cx="1450" cy="786" r="16" fill="#FB7185" fill-opacity=".16"/>
      <path d="M1443 786h14" stroke="#FDA4AF" stroke-width="2.4" stroke-linecap="round"/>
      <text x="1480" y="794" class="note-title">Only add what is different</text>
      <text x="1615" y="836" text-anchor="middle" class="note-title ar" font-size="20">كل مستوى يضيف ما يجعله مختلفاً</text>
      <text x="1615" y="878" text-anchor="middle" class="note-body">A source agent does not start from zero.</text>
      <text x="1615" y="908" text-anchor="middle" class="note-body">It inherits everything above, then adds</text>
      <text x="1615" y="938" text-anchor="middle" class="note-body">only its source-specific behavior.</text>
      <text x="1615" y="976" text-anchor="middle" class="note-body ar">يرث ما فوقه ويضيف خصوصيته فقط</text>
    </g>
    <path d="M1406 934H1324" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrowRed)"/>
  </g>
</svg>
